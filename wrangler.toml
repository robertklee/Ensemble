# Workers + Static Assets; compatible with Cloudflare's default deploy command.
name = "ensemble"
main = "src/worker.ts"
compatibility_date = "2025-09-13"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "none"
run_worker_first = ["/api", "/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ensemble"
database_id = "d2137c96-5f9a-4749-b5e0-c16fd5734de1"
migrations_dir = "migrations"
